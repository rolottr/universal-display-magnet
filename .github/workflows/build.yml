name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS (universal)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and package (ad-hoc signed)
        run: ./scripts/package.sh
      - name: Test
        run: ./scripts/test.sh
      - name: Verify checksum
        working-directory: build
        run: shasum -a 256 -c Universal-Display-Magnet-*-macos.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Universal-Display-Magnet-macos
          path: |
            build/Universal-Display-Magnet-*-macos.zip
            build/Universal-Display-Magnet-*-macos.zip.sha256
          if-no-files-found: error

  test-intel:
    # The universal build runs on Apple silicon; this runs the tests on Intel too.
    name: Tests (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test
        run: ./scripts/test.sh
